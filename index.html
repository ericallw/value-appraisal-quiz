<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你身上哪件事值錢</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">

<style>
  /* 檸檬與亞麻：亞麻布底色配檸檬黃、芥末金與橄欖綠，單一調性，不設深色模式 */
  :root{
    --ground:#F3ECDA;
    --surface:#FAF5E8;
    --surface-2:#EDE1C6;
    --ink:#414B22;
    --ink-soft:#57623C;
    --ink-faint:#847D5C;
    --brass:#93691D;
    --brass-soft:#D9A441;
    --brass-wash:rgba(217,164,65,.18);
    --stamp:#7A4E10;
    --stamp-wash:rgba(122,78,16,.14);
    --line:#DCCBA0;
    --shadow:rgba(70,55,20,.18);
  }

  *{box-sizing:border-box;}
  html,body{background:var(--ground);}
  body{
    margin:0;
    background:
      radial-gradient(1000px 560px at 50% -8%, rgba(240,198,63,.22), transparent 62%),
      var(--ground);
    color:var(--ink);
    font-family:"Noto Sans TC","Noto Sans",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"Space Mono",monospace;}
  h1,h2,h3{font-family:"Noto Serif TC","Noto Serif",serif; text-wrap:balance; margin:0;}

  .stage-wrap{
    max-width:760px;
    margin:0 auto;
    padding:28px 18px 80px;
  }

  /* ---------- top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-bottom:26px;
  }
  .brandmark{
    font-family:"Noto Serif TC",serif;
    font-weight:900;
    font-size:15px;
    letter-spacing:.06em;
    color:var(--ink);
    white-space:nowrap;
  }
  .brandmark span{color:var(--brass);}
  @media (max-width:480px){
    .brandmark{font-size:13px;}
    .brandmark span{display:none;}
  }
  .stubs{display:flex; gap:5px; flex:0 0 auto;}
  .stub{
    width:16px; height:22px;
    border:1.5px solid var(--line);
    border-radius:2px;
    background:var(--surface);
    transition:background .25s, border-color .25s;
  }
  .stub.done{background:var(--brass); border-color:var(--brass);}
  .stub.now{border-color:var(--stamp); border-width:2px;}

  /* ---------- panel ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 24px 60px -22px var(--shadow);
    padding:34px 30px;
    position:relative;
  }
  @media (max-width:560px){ .panel{padding:24px 18px;} }

  .eyebrow{
    font-family:"Space Mono",monospace;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--brass);
    margin-bottom:10px;
    display:block;
  }
  .headline{font-size:clamp(22px,4.6vw,30px); font-weight:800; line-height:1.35;}
  .lede{color:var(--ink-soft); font-size:15px; line-height:1.75; margin-top:12px; max-width:56ch;}
  .lede + .lede{margin-top:8px;}

  /* ---------- buttons ---------- */
  .btnrow{display:flex; justify-content:space-between; align-items:center; margin-top:30px; gap:12px;}
  .btn{
    font-family:"Noto Sans TC",sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:13px 26px;
    border-radius:3px;
    cursor:pointer;
    border:1.5px solid var(--brass);
    background:transparent;
    color:var(--brass);
    position:relative;
    white-space:nowrap;
    transition:transform .15s ease, background .2s, color .2s, opacity .2s;
  }
  .btn::before{
    content:"";
    position:absolute; inset:3px;
    border:1px solid currentColor;
    border-radius:1px;
    opacity:.35;
    pointer-events:none;
  }
  .btn.primary{background:var(--brass); color:var(--surface);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn:not(:disabled):hover{transform:translateY(-1px);}
  .btn:focus-visible{outline:2px solid var(--stamp); outline-offset:2px;}
  .btn.ghost{border-color:var(--line); color:var(--ink-soft);}
  .btn.ghost::before{display:none;}

  .counter{font-family:"Space Mono",monospace; font-size:12.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums;}

  /* ---------- ticket cards ---------- */
  .deck{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:11px;
    margin-top:24px;
  }
  .ticket{
    text-align:left;
    background:var(--surface-2);
    border:1.5px solid var(--line);
    border-radius:7px;
    padding:14px 14px 14px 16px;
    font-size:14.5px;
    line-height:1.5;
    color:var(--ink);
    cursor:pointer;
    position:relative;
    display:flex;
    gap:10px;
    align-items:flex-start;
    transition:border-color .15s, background .15s, transform .12s;
  }
  .ticket:hover:not(:disabled){transform:translateY(-1px);}
  .ticket:disabled{opacity:.38; cursor:not-allowed;}
  .ticket:focus-visible{outline:2px solid var(--stamp); outline-offset:2px;}
  .ticket .num{
    font-family:"Space Mono",monospace;
    font-size:10.5px;
    color:var(--ink-faint);
    flex:0 0 auto;
    padding-top:1px;
    font-variant-numeric:tabular-nums;
  }
  .ticket .txt{flex:1;}
  .ticket.sel{
    border-color:var(--brass);
    background:var(--brass-wash);
  }
  .ticket.sel .num{color:var(--brass);}
  .ticket.sel::after{
    content:"✓";
    position:absolute; top:8px; right:10px;
    color:var(--brass);
    font-weight:700;
    font-size:13px;
  }
  .ticket.locked{
    border-color:var(--stamp);
    border-width:2px;
    background:var(--stamp-wash);
  }
  .ticket.locked::after{
    content:"已鎖定";
    position:absolute; top:-9px; right:10px;
    background:var(--stamp);
    color:var(--surface);
    font-family:"Space Mono",monospace;
    font-size:10px;
    letter-spacing:.05em;
    padding:2px 7px;
    border-radius:2px;
    transform:rotate(-4deg);
  }

  /* ---------- round 1: single-card decision flow ---------- */
  .progline{
    height:3px;
    background:var(--line);
    border-radius:2px;
    margin-top:18px;
    overflow:hidden;
  }
  .progline > div{
    height:100%;
    background:var(--brass);
    transition:width .25s ease;
  }
  @media (prefers-reduced-motion: reduce){ .progline > div{transition:none;} }

  .stack{
    position:relative;
    margin:36px auto 10px;
    max-width:420px;
    min-height:150px;
  }
  .stack .behind{
    position:absolute; inset:0;
    background:var(--surface-2);
    border:1.5px solid var(--line);
    border-radius:9px;
  }
  .stack .behind.b1{transform:rotate(-3deg) translateY(4px);}
  .stack .behind.b2{transform:rotate(2.5deg) translateY(6px); opacity:.7;}
  .stack .front{
    position:relative;
    background:var(--surface-2);
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:26px 22px;
    min-height:150px;
    display:flex;
    align-items:center;
    text-align:center;
  }
  .stack .front .num{
    position:absolute; top:12px; left:14px;
    font-family:"Space Mono",monospace;
    font-size:10.5px;
    color:var(--ink-faint);
  }
  .stack .front .txt{
    font-size:17px;
    line-height:1.55;
    font-weight:700;
    width:100%;
  }

  .swiperow{display:flex; gap:12px; margin-top:22px;}
  .swiperow .btn{flex:1; text-align:center;}

  /* ---------- recap strip (round 4 memory aid) ---------- */
  .recap{
    margin-top:20px;
    padding:14px 16px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:7px;
  }
  .recaplabel{
    font-family:"Space Mono",monospace;
    font-size:10.5px;
    letter-spacing:.06em;
    color:var(--ink-faint);
    margin-bottom:9px;
  }
  .recapchips{display:flex; flex-wrap:wrap; gap:6px;}
  .recapchip{
    font-size:12px;
    line-height:1.4;
    padding:5px 10px;
    border-radius:20px;
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--ink-faint);
  }
  .recapchip.kept{color:var(--ink); border-color:var(--brass-soft);}
  .recapchip.dropped{text-decoration:line-through; opacity:.55;}

  /* ---------- persistence & final questions ---------- */
  .qblock{margin-top:26px;}
  .qblock:first-child{margin-top:24px;}
  .qtext{font-weight:700; font-size:15.5px; margin-bottom:12px; line-height:1.5;}
  .opts{display:flex; flex-wrap:wrap; gap:9px;}
  .opt{
    font-family:"Noto Sans TC",sans-serif;
    font-size:13.5px;
    padding:9px 16px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:var(--surface-2);
    color:var(--ink-soft);
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .opt:hover{border-color:var(--brass-soft);}
  .opt.sel{border-color:var(--brass); background:var(--brass-wash); color:var(--ink); font-weight:700;}
  .opt:focus-visible{outline:2px solid var(--stamp); outline-offset:2px;}

  .finalrow{
    display:flex; align-items:center; gap:12px;
    width:100%; text-align:left;
    padding:14px 16px;
    border:1.5px solid var(--line);
    border-radius:6px;
    background:var(--surface-2);
    color:var(--ink);
    font-size:14.5px;
    cursor:pointer;
    margin-top:9px;
    transition:border-color .15s, background .15s;
  }
  .finalrow .letter{
    font-family:"Space Mono",monospace;
    color:var(--brass);
    font-weight:700;
    font-size:13px;
    flex:0 0 auto;
  }
  .finalrow.sel{border-color:var(--brass); background:var(--brass-wash);}
  .finalrow:focus-visible{outline:2px solid var(--stamp); outline-offset:2px;}

  /* ---------- result / certificate ---------- */
  .cert{position:relative; overflow:hidden;}
  .seal{
    position:absolute; top:22px; right:20px;
    width:74px; height:74px;
    border:2px solid var(--stamp);
    border-radius:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(-9deg);
    color:var(--stamp);
    font-family:"Space Mono",monospace;
    font-size:9px;
    letter-spacing:.04em;
    text-align:center;
    line-height:1.5;
    opacity:.9;
  }
  .seal::before{
    content:"";
    position:absolute; inset:5px;
    border:1px solid var(--stamp);
    border-radius:50%;
  }
  @media (max-width:560px){ .seal{width:58px; height:58px; font-size:7.5px; top:16px; right:14px;} }

  .typebadge{
    display:inline-block;
    font-family:"Space Mono",monospace;
    font-size:11px;
    letter-spacing:.1em;
    color:var(--stamp);
    background:var(--stamp-wash);
    border:1px solid var(--stamp);
    padding:4px 10px;
    border-radius:3px;
    margin-bottom:14px;
  }

  .gapstats{
    display:flex; align-items:center; gap:18px;
    margin:22px 0;
    padding:18px 20px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:8px;
  }
  .gapstats .stat{text-align:center;}
  .gapstats .n{
    font-family:"Space Mono",monospace;
    font-size:30px; font-weight:700;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    line-height:1;
  }
  .gapstats .lbl{font-size:11.5px; color:var(--ink-faint); margin-top:6px;}
  .gapstats .arrow{color:var(--brass-soft); font-size:20px;}

  .callout{
    margin:20px 0;
    padding:18px 20px;
    background:var(--brass-wash);
    border-left:3px solid var(--brass);
    border-radius:2px;
  }
  .callout .k{font-family:"Space Mono",monospace; font-size:10.5px; letter-spacing:.1em; color:var(--brass); text-transform:uppercase; display:block; margin-bottom:7px;}
  .callout .v{font-size:15.5px; font-weight:700; line-height:1.5;}

  .actline{font-size:14.5px; line-height:1.7; margin:16px 0; color:var(--ink-soft);}
  .actline b{color:var(--ink);}

  .quote{
    font-family:"Noto Serif TC",serif;
    font-style:italic;
    font-size:16.5px;
    text-align:center;
    color:var(--ink);
    margin:26px auto;
    max-width:44ch;
    line-height:1.65;
    position:relative;
    padding:0 6px;
  }

  .divider{height:1px; background:var(--line); margin:26px 0; border:none;}

  .note{
    padding:14px 16px;
    border:1px dashed var(--brass-soft);
    border-radius:6px;
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.65;
  }

  .tallyrow{display:flex; align-items:center; gap:12px; margin:6px 0 20px;}
  .tally{display:flex; gap:3px;}
  .tick{width:5px; height:20px; background:var(--line); border-radius:1px;}
  .tick.on{background:var(--brass);}
  .tallytxt{font-family:"Space Mono",monospace; font-size:12.5px; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .catgrid{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:16px;}
  @media (max-width:520px){ .catgrid{grid-template-columns:1fr;} }
  .catcard{
    padding:14px 15px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:7px;
  }
  .catcard .k{font-family:"Space Mono",monospace; font-size:10px; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase; display:block; margin-bottom:6px;}
  .catcard .v{font-size:14.5px; font-weight:700;}

  .sectiontitle{font-size:18px; font-weight:800; margin:30px 0 4px; font-family:"Noto Serif TC",serif;}

  /* ---------- email capture ---------- */
  .capture{
    margin-top:8px;
    padding:20px 20px 22px;
    background:var(--surface-2);
    border:1.5px solid var(--brass-soft);
    border-radius:8px;
  }
  .capform{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .emailinput{
    flex:1 1 220px;
    min-width:0;
    font-family:"Noto Sans TC",sans-serif;
    font-size:14.5px;
    padding:11px 14px;
    border:1.5px solid var(--line);
    border-radius:4px;
    background:var(--surface);
    color:var(--ink);
  }
  .emailinput::placeholder{color:var(--ink-faint);}
  .emailinput:focus-visible{outline:2px solid var(--brass); outline-offset:1px;}
  .capnote{font-size:12.5px; margin-top:10px; line-height:1.6;}
  .capnote.err{color:var(--stamp);}
  .capnote.ok{color:var(--brass);}

  .fade-in{animation:fadeIn .38s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .fade-in{animation:none;}
    .btn, .ticket, .opt, .finalrow{transition:none;}
  }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="topbar">
    <div class="brandmark">夢想人生研究所 <span>· 你身上哪件事值錢</span></div>
    <div class="stubs" id="stubs"></div>
  </div>
  <div class="panel" id="panel"></div>
</div>

<script>
(function(){
  var APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPQKrm_Xt_31-Xs6fDe0prtTsBEn5DakaypWFk8x9SMcf75O8shRqlTPyCM-LimsDpcw/exec";

  var CATS = {
    A:{name:"整理秩序", fast:"代整理服務", digi:"模板／SOP／清單（最容易，最適合先做）"},
    B:{name:"解讀翻譯", fast:"一對一教學", digi:"懶人包／迷你課"},
    C:{name:"情緒承接", fast:"一對一諮詢", digi:"陪跑社群（單價高但難規模化）"},
    D:{name:"品味挑選", fast:"代選服務", digi:"選物清單／推薦名單"},
    E:{name:"動手做出來", fast:"接案", digi:"成品模板／素材包"},
    F:{name:"推動督促", fast:"一對一教練", digi:"陪跑營／打卡社群"}
  };

  var RAW = [
    ["A","把塞滿收據單據的鞋盒，整理成一張看得懂的清單"],
    ["A","把腦裡「憑感覺做」的流程寫成步驟，新人照著就能上手"],
    ["A","把塞爆的行程重新排過，讓會議和會議之間不再撞期"],
    ["A","把一個不知從何開始的大計劃，拆成第一週要做的三件事"],
    ["A","把塞到關不上的衣櫃，整理到每件衣服都拿得出來"],
    ["A","把亂糟糟的帳單，整理成看得出錢花去哪的表"],
    ["A","幫一個各做各的團隊，分清楚誰負責哪一塊、什麼時候交"],
    ["A","把散落在十幾個地方的筆記，整理成一個查得到的地方"],
    ["B","把合約或報告裡的專業術語，翻成一句白話"],
    ["B","幫人看一份合約，圈出真正該小心的那幾行"],
    ["B","把一本厚書，濃縮成十分鐘講得完的重點"],
    ["B","幫人比較幾個看起來差不多的方案，講清楚差在哪"],
    ["B","教一個完全不會用的人，把一個工具用到上手"],
    ["B","幫人看一份數字報告，一眼指出真正該注意的那個變化"],
    ["B","把一個講三次都講不清的流程，畫成一張看得懂的圖"],
    ["B","幫人模擬一次面試，講出哪裡會被問倒"],
    ["C","聽一個人講完一肚子煩惱，對方說「舒服多了」"],
    ["C","在大家都慌的時候，第一個開口把場面穩住"],
    ["C","幫兩個吵到不講話的人，把話重新講開"],
    ["C","陪一個人去做他一個人絕對不敢去做的事"],
    ["C","對方還沒開口，就先察覺到他今天不對勁"],
    ["C","幫人把一件他覺得世界末日的事，換個角度看回去"],
    ["C","半夜照顧一個生病的人到天亮"],
    ["C","讓一個緊張到手在發抖的人，慢慢放鬆下來"],
    ["D","幫人挑一份對方一看就知道你有用心的禮物"],
    ["D","幫人訂一間不會踩雷的餐廳"],
    ["D","幫人從衣櫃裡配出一套今天終於對了的造型"],
    ["D","幫人在十個差不多的產品裡，指出該買哪個和原因"],
    ["D","幫人在一百張照片裡，選出那張就是這張"],
    ["D","幫人想一個一聽就記得住的名字或標題"],
    ["D","幫人直接拍板買哪一個，讓他不用再花時間比較"],
    ["D","找到別人找了很久都找不到的店或門路"],
    ["E","把一個口頭講的想法，變成一份拿得出去的簡報"],
    ["E","把一個大家覺得該丟的東西，修好繼續用"],
    ["E","把一段普通的素材，剪成一條有人看完的片"],
    ["E","用冰箱剩下的材料，做出一道大家搶著吃的菜"],
    ["E","寫一段別人本來不想看，卻看到最後的文字"],
    ["E","把一堆文字，排成一張看得舒服的畫面"],
    ["E","用工具搭出一個原本要人手做的東西，讓它自動跑"],
    ["E","把一個空間佈置到讓人一進來就說「哇」"],
    ["F","盯著一個人，把他拖了很久的事終於逼出來"],
    ["F","把一群各自為政的人，組織起來完成同一件事"],
    ["F","幫人把「我想變好」訂成一個做得到的目標"],
    ["F","在對方說「我想放棄」那一刻，讓他多撐一天"],
    ["F","帶一個什麼都不懂的新人，兩星期內能自己上手"],
    ["F","主持一場吵不出結論的會議，最後真的定案"],
    ["F","幫人去談一個他原本不敢開口爭取的條件"],
    ["F","把一件卡了半年的事，推到終於往前一步"]
  ];

  var CARDS = RAW.map(function(r,i){ return {id:i+1, cat:r[0], text:r[1]}; });
  // 打亂順序，讓分類不會被看出來
  (function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1));

  function submitCapture(email){
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
      state.capture = {status:"idle", error:"email 格式不正確，請再檢查一次。"};
      render();
      return;
    }
    state.capture = {status:"sending", error:null};
    render();

    if(APP_SCRIPT_URL.indexOf("PASTE_") === 0){
      state.capture = {status:"idle", error:"後端尚未接通（開發中）——部署 Apps Script 後，這個按鈕才會真正寄出 email。"};
      render();
      return;
    }

    var payload = collectPayload();
    payload.email = email;

    fetch(APP_SCRIPT_URL, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(payload)
    }).then(function(res){
      if(!res.ok) throw new Error("bad status");
      return res.json();
    }).then(function(){
      state.capture = {status:"sent", error:null};
      render();
    }).catch(function(){
      state.capture = {status:"idle", error:"無法寄出，請檢查網路連線，或直接透過 IG DM 聯絡我。"};
      render();
    });
  }

    panel.appendChild(el("p","actline","<b>你的答案：</b>「"+FINAL_OPTS[state.finalChoice]+"」——"+FINAL_LINES[state.finalChoice]));
    panel.appendChild(el("p","lede","這張卡只是第一步——夢想人生研究所接下來會陸續推出更多工具，幫你一步步研究出自己的方向。"));

    var hr3 = document.createElement("hr"); hr3.className="divider"; panel.appendChild(hr3);
    renderCapture();

    var row = el("div","btnrow");
    var btn = el("button","btn ghost","重新鑑定一次");
    btn.onclick = function(){
      state = freshState();
      render();
    };
    row.appendChild(el("span","counter",""));
    row.appendChild(btn);
    panel.appendChild(row);
  }

  render();
})();
</script>
